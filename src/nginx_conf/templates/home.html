<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fa;
        color: #17202a;
      }

      main {
        width: min(40rem, calc(100vw - 2rem));
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #536171;
        font-size: 1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p>Hello World. Die Web-App läuft.</p>
    </main>
  </body>
</html>
