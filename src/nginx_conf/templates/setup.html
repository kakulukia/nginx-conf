<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" sizes="any" href="{{ url_for('static', path='favicon.svg') }}">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fa;
        color: #17202a;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
      }

      label {
        display: block;
        margin-top: 1rem;
      }

      input,
      textarea,
      button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 0.35rem;
      }

      .meta {
        color: #536171;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p class="meta">Setup-Token: {{ setup_token_path }}</p>
      <form action="/api/setup" method="post">
        <label>
          Setup-Token
          <input name="setup_token" autocomplete="one-time-code" required>
        </label>
        <label>
          Nutzername
          <input name="username" value="admin" autocomplete="username" required>
        </label>
        <label>
          Server-IP-Adressen fuer DNS-Preflight
          <textarea name="server_ips" rows="3"></textarea>
        </label>
        <button type="submit">Setup abschliessen</button>
      </form>
    </main>
  </body>
</html>
