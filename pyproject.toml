[project]
name = "nginx-conf"
version = "0.1.0"
description = "Web tool for managing Nginx project configs"
readme = "docs/technikreferenz.md"
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.146.0",
    "jinja2==3.1.6",
    "pyotp==2.10.0",
    "python-multipart==0.0.32",
    "qrcode==8.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--ignore=tests/opt"

[tool.ruff]
line-length = 121
target-version = "py315"
extend-exclude = ["tests/opt"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
