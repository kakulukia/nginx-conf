[project]
name = "nginx-conf"
version = "0.1.0"
description = "Web tool for managing Nginx project configs"
readme = "TODO.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=3.5.0",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 121
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
